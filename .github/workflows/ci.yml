name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the project targets net10.0-windows, so the SDK must be 10.x
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: restore + build
        run: dotnet build ddos-sim/ddos-sim.csproj -c Release --nologo

      # drives the whole phase machine synchronously and exits non-zero on failure
      - name: phase-machine self-test
        shell: pwsh
        run: |
          $exe = "ddos-sim/bin/Release/net10.0-windows/NTPX-RUST.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: upload self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: selftest.txt
          if-no-files-found: ignore
